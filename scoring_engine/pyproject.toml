[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unobio-scoring"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "scipy>=1.10"]

[tool.setuptools]
packages = ["scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
